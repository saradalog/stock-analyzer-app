<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5c4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="銘柄分析">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>銘柄分析</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--sub:#6b6a66;--line:#e4e2dc;--acc:#1f5c4a;--up:#c0392b;--down:#1f6fb2}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--sub:#9a9891;--line:#2e2d2a;--acc:#6fbf9f;--up:#ff7b6b;--down:#6aaee8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 80px}
.top{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:5}
.search{display:flex;gap:8px;position:relative}
.search input{flex:1;min-width:0;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.btn{padding:0 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:600}
.ghost{background:var(--card);color:var(--sub);border:1px solid var(--line)}
.sugg{position:absolute;left:0;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.sugg div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.sugg div:last-child{border:0}
.sugg span{color:var(--sub);font-size:12px;margin-left:6px}
.chips{display:flex;gap:6px;margin:8px 0 2px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.chip.fav{border-color:var(--acc);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{position:relative}
.hero h1{font-size:20px;margin:0;padding-right:40px}
.star{position:absolute;right:10px;top:10px;font-size:24px;background:none;border:0;color:var(--sub)}
.star.on{color:#d4a017}
.meta{color:var(--sub);font-size:13px}
.price{font-size:30px;font-weight:700;margin-top:6px}
.price small{font-size:13px;color:var(--sub);font-weight:400;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kpi{text-align:center;padding:6px 0;border-radius:8px;background:var(--bg)}
.kpi b{display:block;font-size:16px}
.kpi span{font-size:11px;color:var(--sub)}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.score div{padding:8px 4px;border-radius:10px;background:var(--bg);text-align:center}
.score b{display:block;font-size:13px}
.score span{font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{flex:1;padding:8px 2px;border:0;border-radius:8px;background:transparent;color:var(--sub);font-size:14px;font-weight:600}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
h2{font-size:15px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;color:var(--sub);font-weight:400;position:sticky;left:0;background:var(--card)}
thead th{color:var(--sub);font-weight:400;font-size:12px}
.scroll{overflow-x:auto}
.neg{color:var(--down)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow.composite{margin:0 -6px 8px;padding:12px 8px;border:1px solid var(--acc);border-radius:10px;background:rgba(31,92,74,.06)}
.vrow.composite .nm{font-size:14px;font-weight:700;color:var(--ink)}
.vrow.composite .v{font-size:24px}
.vrow:last-of-type{border:0}
.nm{font-size:13px;color:var(--sub)}
.v{font-size:20px;font-weight:700;text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.b-under{background:rgba(31,92,74,.13);color:var(--acc)}
.b-over{background:rgba(192,57,43,.13);color:var(--up)}
.note{font-size:12px;color:var(--sub);margin-top:6px}
.self td{font-weight:700;color:var(--ink)}
tr.link td{cursor:pointer}
.cw{position:relative;height:220px}
.empty{text-align:center;color:var(--sub);padding:30px 8px}
.msg{font-size:13px;padding:8px 12px;border-radius:10px;margin:8px 0;background:rgba(31,92,74,.1);color:var(--acc)}
.msg.err{background:rgba(192,57,43,.1);color:var(--up)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
label input{display:block;width:100%;margin-top:4px;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{padding:10px 14px}
.sortsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.sortsel button{flex:none;font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.sortsel button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rank td{cursor:pointer}
.rank .big{font-weight:700;color:var(--ink)}
.rank td:first-child{white-space:normal;min-width:8.5em;max-width:10em}
.rank .nm2{font-size:11px;color:var(--sub);display:block}
#ownedit .yr{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#ownedit .yr b{grid-column:1/-1;margin-top:10px}
#ownedit label{font-size:12px;margin:6px 0 0}
#ownedit label input{padding:6px 8px;font-size:14px}
</style>
</head>

/* ---------- 通信 ---------- */
async function api(action,params={}){
  const c=S.cfg,ac=new AbortController(),tm=setTimeout(()=>ac.abort(),30000);
  const q=Object.entries({action,token:c.token,...params}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  try{
    const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+q,{signal:ac.signal});
    const j=await r.json().catch(()=>({error:'bad_response'}));
    if(j.error)throw new Error(j.error);
    return j;
  }catch(e){
    const m={bad_token:'合言葉が違います。設定を確認してください。',no_token_set:'Apps Script の合言葉（MY_TOKEN）が未設定です。',
      no_data:'データがまだありません（GitHub Actions の初回実行を待ってください）。',not_found:'その銘柄は見つかりませんでした。',
      bad_code:'銘柄コードは4桁で入れてください。',bad_response:'Apps Script から想定外の応答です。URLが …/exec か確認してください。',AbortError:'通信がタイムアウトしました。'};
    throw new Error(m[e.message]||m[e.name]||('通信できませんでした（'+e.message+'）'));
  }finally{clearTimeout(tm)}
}
async function loadList(force){
  if(demo()){S.list=Object.values(DEMO).map(d=>[d.code,d.name,d.sector,d.market]);return}
  if(S.list&&!force&&LS.get('listDay','')===new Date().toDateString())return;
  try{const j=await api('list');S.list=j.list;S.updated=j.updated;LS.set('list',j.list);LS.set('updated',j.updated);LS.set('listDay',new Date().toDateString())}
  catch(e){if(!S.list)msg(e.message,true)}
}
async function getStock(code){
  if(demo()){return DEMO[code]||null}
  if(S.mem[code])return S.mem[code];
  const c=LS.get('st_'+code,null);
  if(c&&c.u&&c.u===S.updated&&c.d){S.mem[code]=c.d;return c.d}
  const j=await api('get',{code});S.mem[code]=j.data;
  if(j.updated)LS.set('st_'+code,{u:j.updated,d:j.data});
  if(j.updated&&j.updated!==S.updated){S.updated=j.updated;LS.set('updated',j.updated);loadList(true)}
  return j.data;

const SCN=[['base','普通'],['bull','強気'],['bear','弱気']];
function ownModel(d){  // 端末で変えた前提を重ねる
  const m=JSON.parse(JSON.stringify(d.own.model)),ov=LS.get('own_'+d.code,null);
  if(ov&&ov.updated===m.updated&&ov.base)m.scenarios.base=ov.base;
  return {m,edited:!!(ov&&ov.updated===m.updated)};
}
const OWN_LB={sales:'売上高',op:'営業利益',np:'純利益',vol:'台数の効果',price:'値上げ・構成の効果',fx:'為替の効果',vol_in:'台数 %',price_in:'値上げ %'};
function ownLabels(m){return Object.assign({},OWN_LB,m.labels||{})}
// mode 'bridge'（既定）：前期の営業利益＋台数・値上げ・為替・個別項目の効果
// mode 'pool'：利益（費用はマイナス）の積み上げ。営業利益＝各項目の合計＋調整額＋その年だけの個別項目
function npRatioAt(m,t){const r=m.np_ratio;return Array.isArray(r)?+(r[t]??r[r.length-1]??0):+(r||0)}
function npRatioAllOne(m){const r=m.np_ratio;return Array.isArray(r)?r.length>0&&r.every(x=>+x===1):+r===1}
function ownCalc(m,sc,inp){
  const rows=[],pool=m.mode==='pool';let seg=m.segments.map(g=>g.sales),fx0=Object.assign({},m.base.fx),op=m.base.op,sh=inp.shares;
  const adjust=pool?(m.adjust!=null?m.adjust:m.base.op-seg.reduce((a,b)=>a+b,0)):0;
  (m.scenarios[sc]||[]).forEach((y,t)=>{
    const fx=Object.assign({},fx0,y.fx||{});let volE=0,priceE=0,fxE=0;
    const nseg=m.segments.map((g,i)=>{
      const v=(y.vol||{})[g.key]||0,p=(y.price||{})[g.key]||0,pt=g.pt||0;
      let f=0;Object.entries(g.fx||{}).forEach(([c,w])=>{if(fx0[c])f+=w*(fx[c]/fx0[c]-1)});
      const nv=seg[i]*(1+v)*(1+p)*(1+f);
      if(pool){volE+=seg[i]*v;priceE+=seg[i]*(1+v)*p;fxE+=seg[i]*(1+v)*(1+p)*f}
      else{volE+=seg[i]*v*m.cm;priceE+=seg[i]*(1+v)*p*(1-pt)}
      return nv;
    });
    if(!pool)Object.entries(m.fx_sens||{}).forEach(([c,k])=>{if(fx0[c]&&fx[c])fxE+=k*(fx[c]-fx0[c])});
    const items=(y.items||[]).map(it=>[it.label,+it.amount||0]),itemsE=items.reduce((a,b)=>a+b[1],0);
    const sales=nseg.reduce((a,b)=>a+b,0);
    let base_op=op;
    if(pool){const prevItems=t>0?rows[t-1].itemsE:0;op=sales+adjust+itemsE;base_op=rows.length?rows[t-1].op:m.base.op;
      // 前年の個別項目がなくなる分も内訳に出す
      items.push(...(t>0&&prevItems?[['前年の個別項目の反動',-prevItems]]:[]));}
    else op=op+volE+priceE+fxE+itemsE;
    const np=op*npRatioAt(m,t);sh=sh*(1+((m.share_change||[])[t]||0));
    rows.push({fy:m.years[t],sales,op,np,eps:np*1e6/sh,volE,priceE,fxE,items,itemsE,fx,segs:nseg,prev_op:base_op});
    seg=nseg;fx0=fx;
  });
  return rows;
}
function rimJS(bps,roe0,r,payout){let v=bps,b=bps;for(let t=1;t<=10;t++){const rt=r+(roe0-r)*(10-t+1)/10;v+=(rt-r)*b/Math.pow(1+r,t);b*=1+rt*(1-payout)}return v}
function ownFair(inp,eps){
  if(!(inp.bps>0)||eps==null)return null;
  const payout=eps>0&&inp.dps!=null?Math.min(1,Math.max(0,inp.dps/eps)):0.3;
  return rimJS(inp.bps,Math.min(0.6,Math.max(-0.5,eps/inp.bps)),inp.r,payout);
}

      ${final.baseline_forecast==null?'':`<div class="note">初回保存予想（${esc(final.baseline_as_of||'')}） ${oku(final.baseline_forecast)}億円</div>`}</div>
    <div class="v">${final.error==null?'—':`<span class="badge ${Math.abs(final.error)<=5?'b-under':'b-over'}">最新誤差 ${final.error>=0?'+':''}${fmt(final.error,1)}%</span>`}
    ${final.baseline_error==null?'':`<div><span class="badge ${Math.abs(final.baseline_error)<=5?'b-under':'b-over'}">初回誤差 ${final.baseline_error>=0?'+':''}${fmt(final.baseline_error,1)}%</span></div>`}
    ${final.company_error==null?'':`<div class="note">会社予想比 ${final.company_error>=0?'+':''}${fmt(final.company_error,1)}%</div>`}</div></div>`:'';
  return `<div class="card"><h2>${esc(p.fy.slice(0,7))}期 四半期進捗・予想検証</h2>
    <div class="note">対象：${esc(label)}。独自年間予想 ${oku(target)}億円${ct!=null?'・会社予想 '+oku(ct)+'億円':''}。達成率は累計実績÷年間予想。</div>
    <div class="scroll"><table><thead><tr><th></th><th>累計実績</th><th>独自達成率</th><th>時点ペース比</th><th>会社達成率</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="note">時点ペース比＝独自達成率÷経過率（Q1 25%・Q2 50%・Q3 75%・Q4 100%）。100%以上なら単純ペースでは年間予想を上回る進捗。</div>
    ${finalBox}</div>`;
}

    ${npRatioAllOne(m)&&L.op===L.np?'':`<tr><td>${esc(L.np)}</td><td>${oku(m.base.np)}</td>${rows.map(r=>`<td>${oku(r.np)}</td>`).join('')}</tr>`}
    <tr><td>EPS（円）</td><td>${fmt(m.base.np*1e6/inp.shares,0)}</td>${rows.map(r=>`<td>${fmt(r.eps,0)}</td>`).join('')}</tr>
    </tbody></table></div>
    ${c&&c.fy===first.fy&&(c.sales!=null||c.op!=null||c.np!=null)?`<table style="margin-top:10px"><thead><tr><th>${esc(c.fy.slice(0,7))}期</th><th>独自</th><th>会社予想</th><th>差</th></tr></thead><tbody>
      ${[[L.sales,first.sales,c.sales],[L.op,first.op,c.op],[L.np,first.np,c.np]].filter((x,i)=>x[0]&&x[2]!=null&&!(i===2&&L.op===L.np)).map(([l,a,b])=>`<tr><td>${esc(l)}</td><td>${oku(a)}</td><td>${oku(b)}</td><td>${dl(diff(a,b))}</td></tr>`).join('')}</tbody></table>

    ${edited?'<div class="note" style="color:var(--up)">※ 普通シナリオの前提をこの端末で変更中</div>':''}</div>

      <div class="v">${v?'¥'+fmt(v,0):'—'}<div>${g==null?'':`<span class="badge ${g>0?'b-under':'b-over'}">${g>0?'割安':'割高'} ${g>0?'+':''}${fmt(g,0)}%</span>`}</div></div></div>`).join('')}
    <div class="note">BPS ${fmt(inp.bps,0)}円・資本コスト${fmt(inp.r*100,0)}%・配当 ${fmt(inp.dps,0)}円で計算（四季報ビューアと同じ式）。現在値 ¥${fmt(inp.price,0)}。</div></div>
  <div class="card"><h2>${esc(first.fy.slice(0,7))}期の${esc(L.op)}の増減（${SCN.find(x=>x[0]===sc)[1]}・億円）</h2>
    <table><tbody><tr><td>前期の${esc(L.op)}</td><td>${oku(m.base.op)}</td></tr>
    <tr><td>${esc(L.vol)}${pool?'':`（限界利益率${fmt(m.cm*100,0)}%）`}</td><td${cls(first.volE)}>${first.volE>=0?'+':''}${oku(first.volE)}</td></tr>
    ${m.no_price?'':`<tr><td>${esc(L.price)}</td><td${cls(first.priceE)}>${first.priceE>=0?'+':''}${oku(first.priceE)}</td></tr>`}
    <tr><td>${esc(L.fx)}</td><td${cls(first.fxE)}>${first.fxE>=0?'+':''}${oku(first.fxE)}</td></tr>
    ${first.items.map(([l,a])=>`<tr><td>${esc(l)}</td><td${cls(a)}>${a>=0?'+':''}${oku(a)}</td></tr>`).join('')}
    <tr><td><b>${esc(L.op)}</b></td><td><b>${oku(first.op)}</b></td></tr></tbody></table>
    ${pool?`<h2 style="margin-top:12px">項目ごとの見通し（億円）</h2><div class="scroll yr"><table><thead><tr><th></th><th>実</th>${rows.map(r=>`<th>${esc(r.fy.slice(2).replace('-','/'))}予</th>`).join('')}</tr></thead><tbody>
      ${m.segments.map((g,i)=>`<tr><td>${esc(g.label)}</td><td${cls(g.sales)}>${oku(g.sales)}</td>${rows.map(r=>`<td${cls(r.segs[i])}>${oku(r.segs[i])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`:''}
    <div class="note">${esc(m.formula)}</div></div>
  <div class="card"><h2>前提を変える（普通シナリオ）</h2><div id="ownedit"></div>
    <div class="row"><button class="btn" id="own-save">計算し直す</button><button class="btn ghost" id="own-reset">元に戻す</button></div>

  <div class="card"><h2>前提の根拠</h2>${m.assumptions.map(a=>`<p class="note" style="color:var(--ink)">・${esc(a)}</p>`).join('')}
    <h2 style="margin-top:12px">市場規模</h2>${(m.market||[]).map(x=>`<p class="note" style="color:var(--ink)">・${esc(x.label)}：${esc(x.value)}${x.src!=null&&m.sources[x.src]?` <a href="${esc(m.sources[x.src].url)}" target="_blank" rel="noopener">[出典]</a>`:''}</p>`).join('')}
    <p class="note">${esc(m.cm_note||'')}</p><p class="note">${esc(m.fx_note||'')}</p><p class="note">${esc(m.np_note||'')} ${esc(m.share_note||'')}</p>
    <h2 style="margin-top:12px">出典</h2>${m.sources.map(x=>`<p class="note"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></p>`).join('')}
    <p class="note">${esc(m.author)}（更新 ${esc(m.updated)}）</p></div>`;
  // シナリオ切替
  P.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{LS.set('own_sc',b.dataset.sc);pane()});
  // グラフ
  if(window.Chart&&$('#c5')){
    const labels=[m.base.fy].concat(m.years).map(y=>y.slice(2).replace('-','/'));
    const ds=SCN.map(([k,l],i)=>({label:l,data:[m.base.op].concat(R[k].map(r=>r.op)).map(v=>Math.round(v/100)),
      borderColor:i===0?acc:sub,borderDash:i===0?[]:(i===1?[2,2]:[6,3]),tension:.2,pointRadius:i===0?3:0}));
    if(c&&c.op!=null)ds.push({label:'会社予想',data:labels.map((x,i)=>i===1?Math.round(c.op/100):null),borderColor:'#c0392b',backgroundColor:'#c0392b',pointRadius:6,showLine:false});
    charts.push(new Chart($('#c5'),{type:'line',data:{labels,datasets:ds},options:{plugins:{legend:{position:'bottom'}},scales:{y:{grid:{display:false}}}}}));
  }
  // 編集欄
  const base=m.scenarios.base,E=$('#ownedit'),pc=v=>Math.round((v||0)*1000)/10;
  E.innerHTML=base.map((y,t)=>`<div class="yr"><b style="font-size:13px">${esc(m.years[t].slice(0,7))}期</b>
    ${m.segments.map(g=>`<label>${esc(g.label)} ${esc(L.vol_in)} <input type="number" step="0.5" data-t="${t}" data-k="vol" data-g="${g.key}" value="${pc((y.vol||{})[g.key])}"></label>
      ${m.no_price?'':`<label>${esc(g.label)} ${esc(L.price_in)} <input type="number" step="0.5" data-t="${t}" data-k="price" data-g="${g.key}" value="${pc((y.price||{})[g.key])}"></label>`}`).join('')}
    ${Object.keys(Object.assign({},m.fx_sens||{},m.base.fx||{})).filter(cy=>(m.fx_sens||{})[cy]||m.mode==='pool').map(cy=>`<label>為替 ${cy}（円）<input type="number" step="1" data-t="${t}" data-k="fx" data-g="${cy}" value="${(y.fx||{})[cy]??''}"></label>`).join('')}
    ${(y.items||[]).map((it,i)=>`<label>${esc(it.label)}（億円）<input type="number" step="10" data-t="${t}" data-k="item" data-g="${i}" value="${Math.round(it.amount/100)}"></label>`).join('')}</div>`).join('');
  $('#own-save').onclick=()=>{

    E.querySelectorAll('input').forEach(i=>{const t=+i.dataset.t,k=i.dataset.k,g=i.dataset.g,v=parseFloat(i.value);if(isNaN(v))return;
      if(k==='vol'||k==='price'){nb[t][k]=nb[t][k]||{};nb[t][k][g]=v/100}
      else if(k==='fx'){nb[t].fx=nb[t].fx||{};nb[t].fx[g]=v}
      else if(k==='item'){nb[t].items[+g].amount=v*100}});
    LS.set('own_'+d.code,{updated:d.own.model.updated,base:nb});LS.set('own_sc','base');pane();
  };
  $('#own-reset').onclick=()=>{try{localStorage.removeItem('ma_own_'+d.code)}catch(e){};pane()};
}

/* ---------- 銀行・還元利回り ---------- */
function bankCard(d){
  const b=d.bank,gap=b.pbr&&b.fair_pbr?(b.fair_pbr/b.pbr-1)*100:null;
  return `<div class="card"><h2>銀行・金融の物差し</h2>
    <table><tbody>
    <tr><td>今のPBR</td><td>${fmt(b.pbr,2)} 倍</td></tr>
    <tr><td>妥当PBR（ROE÷資本コスト）</td><td><b>${fmt(b.fair_pbr,2)} 倍</b></td></tr>
    <tr><td>ROE（${esc(b.roe_src)}）</td><td>${fmt(b.roe,1)}%</td></tr>
    <tr><td>資本コスト</td><td>${fmt(b.r,0)}%</td></tr>
    <tr><td>妥当PBRとの差</td><td>${gap==null?'—':`<span class="badge ${gap>0?'b-under':'b-over'}">${gap>0?'割安':'割高'} ${gap>0?'+':''}${fmt(gap,0)}%</span>`}</td></tr>
    </tbody></table>
    <div class="note">ROEが資本コストと同じならPBR1倍が妥当、ROEが高いほど高いPBRが正当化される。資本コストは時価総額で6%・8%・10%。</div>
    <h2 style="margin-top:14px">${esc(d.sector)}の PBR × ROE（${(b.scatter||[]).length}社）</h2>
    <div class="cw"><canvas id="c4"></canvas></div>
    <div class="note">線は資本コスト${fmt(b.r,0)}%のときの妥当PBR。線より下にある会社ほど、ROEのわりにPBRが低い（割安）。濃い点がこの銘柄。</div></div>`;
}
function bankChart(d,acc,sub){
  if(!window.Chart||!$('#c4'))return;
  const b=d.bank,pts=(b.scatter||[]).filter(r=>r[2]<5&&r[3]>-10&&r[3]<30);
  const mx=Math.max(15,...pts.map(r=>r[3]));
  charts.push(new Chart($('#c4'),{type:'scatter',data:{datasets:[
    {label:'妥当PBR',type:'line',data:[{x:0,y:0},{x:mx,y:mx/b.r}],borderColor:sub,borderDash:[4,3],pointRadius:0},
    {label:'同業',data:pts.filter(r=>r[0]!==d.code).map(r=>({x:r[3],y:r[2],n:r[1]})),backgroundColor:sub+'88',pointRadius:4},
    {label:d.name,data:[{x:b.roe,y:b.pbr,n:d.name}],backgroundColor:acc,pointRadius:8}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.n?`${c.raw.n}: ROE ${c.parsed.x}% / PBR ${c.parsed.y}`:''}}},
      scales:{x:{title:{display:true,text:'ROE%'}},y:{title:{display:true,text:'PBR'},min:0}}}}));
}
function retCard(d){
  const r=d.ret; if(!r)return '';
  return `<div class="card"><h2>株主還元利回り ${r.total==null?'—':fmt(r.total,1)+'%'}</h2>
    <table><tbody><tr><td>配当利回り（1株配当 ${fmt(r.dps,1)}円）</td><td>${r.div==null?'—':fmt(r.div,2)+'%'}</td></tr>
    <tr><td>自社株買い（株数の減少率）</td><td${cls(r.buyback)}>${r.buyback==null?'—':fmt(r.buyback,2)+'%'}</td></tr></tbody></table>
    <div class="note">配当は会社予想を優先。株数の減少率は直近2期の期末株数（自己株式を除く）の比較で、増資や株式報酬で増えるとマイナスになる。</div></div>`;
}

/* ---------- お気に入り一覧 ---------- */
const gapOf=(d,name)=>{const r=(d.fv||[]).find(x=>x[0]===name);return r?r[3]:null};
const SORTS=[
  ['total','総合理論の乖離',d=>gapOf(d,'総合理論株価'),-1,v=>(v>0?'+':'')+fmt(v,0)+'%'],
  ['op_ev','営業利益/EV',d=>(d.ev||{}).op_ev,-1,v=>fmt(v,1)+'%'],
  ['op_ev_f','営業利益/EV(予)',d=>(d.ev||{}).op_ev_f,-1,v=>fmt(v,1)+'%'],
  ['ev_ebitda','EV/EBITDA',d=>(d.ev||{}).ev_ebitda,1,v=>fmt(v,1)+'倍'],
  ['ri','残余利益の乖離',d=>gapOf(d,'残余利益モデル'),-1,v=>(v>0?'+':'')+fmt(v,0)+'%'],
  ['dcf','DCFの乖離',d=>gapOf(d,'DCF法'),-1,v=>(v>0?'+':'')+fmt(v,0)+'%'],
  ['evm','EV/EBITDA倍率の乖離',d=>gapOf(d,'EV/EBITDA倍率法'),-1,v=>(v>0?'+':'')+fmt(v,0)+'%'],
  ['ret','還元利回り',d=>(d.ret||{}).total,-1,v=>fmt(v,1)+'%'],
  ['fpbr','妥当PBRとの差',d=>d.bank&&d.bank.pbr&&d.bank.fair_pbr?(d.bank.fair_pbr/d.bank.pbr-1)*100:null,-1,v=>(v>0?'+':'')+fmt(v,0)+'%'],
  ['per','予想PER',d=>(d.fc||{}).per,1,v=>fmt(v,1)+'倍'],
  ['roe','ROE',d=>last(d.s.roe),-1,v=>fmt(v,1)+'%'],
];
async function favList(){
  msg('');location.hash='list';S.cur=null;
  const codes=S.fav.length?S.fav:[];
  if(!codes.length){$('#out').innerHTML='<div class="card empty">お気に入りがまだありません。<br>銘柄画面の ☆ を押すとここに並びます。</div>';return}
  $('#out').innerHTML=`<div class="card empty">読み込み中… 0/${codes.length}</div>`;
  const got={};let done=0,err=null,i=0;
  async function worker(){while(i<codes.length){const c=codes[i++];
    try{const d=await getStock(c);if(d)got[c]=d}catch(e){err=e.message}
    done++;const el=$('#out .empty');if(el)el.textContent=`読み込み中… ${done}/${codes.length}`}}
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(err)msg(err,true);
  S.listData=got;renderList();
}
function renderList(){
  const key=LS.get('sort','total'),srt=SORTS.find(x=>x[0]===key)||SORTS[0],[k,label,get,dir,fmtv]=srt;
  const rows=Object.values(S.listData||{}).map(d=>({d,v:get(d)}));
  rows.sort((a,b)=>(a.v==null)-(b.v==null)||dir*((a.v??0)-(b.v??0)));
  const g=(d,n)=>{const v=gapOf(d,n);return v==null?'—':(v>0?'+':'')+fmt(v,0)+'%'};
  $('#out').innerHTML=`<div class="card"><h2>お気に入り ${rows.length}銘柄</h2>
    <div class="sortsel">${SORTS.map(x=>`<button data-k="${x[0]}" class="${x[0]===k?'on':''}">${x[1]}</button>`).join('')}</div>
    <div class="scroll"><table class="rank"><thead><tr><th></th><th>${esc(label)}</th><th>株価</th><th>総合理論</th><th>営業利益/EV</th><th>EV/EBITDA</th><th>残余利益</th><th>DCF</th><th>予想PER</th></tr></thead><tbody>
    ${rows.map(({d,v},n)=>`<tr data-c="${esc(d.code)}"><td>${n+1}. ${esc(d.name)}<span class="nm2">${esc(d.code)}・${esc(d.sector)}</span></td>
      <td class="big"${cls(v)}>${v==null?'—':fmtv(v)}</td><td>${fmt(d.price,0)}</td><td>${g(d,'総合理論株価')}</td>
      <td>${(d.ev||{}).op_ev==null?'—':fmt(d.ev.op_ev,1)+'%'+(d.ev.basis_op&&d.ev.basis_op!=='営業利益'?'*':'')}</td><td>${fmt((d.ev||{}).ev_ebitda,1)}</td>
      <td>${g(d,'残余利益モデル')}</td><td>${g(d,'DCF法')}</td><td>${fmt((d.fc||{}).per,1)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note">総合理論・残余利益・DCF は理論株価と株価の差（プラスが割安）。総合理論は保有銘柄だけ表示し、銘柄ごとの既存モデルを加重平均。営業利益/EV は大きいほど、EV/EBITDA・PER は小さいほど割安。* は営業利益が無いため税引前利益で計算。行をタップするとその銘柄を開きます。</div></div>`;
  document.querySelectorAll('.sortsel button').forEach(b=>b.onclick=()=>{LS.set('sort',b.dataset.k);renderList()});
  document.querySelectorAll('.rank tbody tr').forEach(t=>t.onclick=()=>show(t.dataset.c));
}
$('#favlist').onclick=favList;

async function start(){
  await loadList(false);chips();
  const h=location.hash.slice(1);
  if(h==='list')return favList();
  const first=/^[0-9A-Z]{4}$/.test(h)?h:(S.recent[0]||S.fav[0]||(demo()?'7208':null));
  if(first)show(first);
  else $('#out').innerHTML='<div class="card empty">銘柄コードか会社名を入れてください</div>';
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='list'&&S.cur)return favList();if(/^[0-9A-Z]{4}$/.test(h)&&(!S.cur||S.cur.code!==h))show(h)});
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname.endsWith('github.io'))navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
